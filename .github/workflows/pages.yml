name: Deploy X Reply Copilot H5

on:
  push:
    branches: [master]
    paths:
      - 'h5/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./h5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Bark on success
        if: ${{ steps.deployment.outcome == 'success' }}
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER_URL: ${{ secrets.BARK_SERVER_URL || 'https://api.day.app' }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '手动触发部署' }}
        run: |
          title="X Assistant 部署成功"
          body="$(cat <<EOF
          分支：${GITHUB_REF_NAME}
          提交：${GITHUB_SHA::7}
          提交信息：${COMMIT_MESSAGE}
          EOF
          )"

          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n \
              --arg device_key "$BARK_KEY" \
              --arg title "$title" \
              --arg body "$body" \
              --arg url "$PAGES_URL" \
              '{device_key: $device_key, title: $title, body: $body, url: $url, level: "active"}')" \
            "${BARK_SERVER_URL%/}/push"

      - name: Notify Bark on failure
        if: ${{ failure() && steps.deployment.outcome == 'failure' }}
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER_URL: ${{ secrets.BARK_SERVER_URL || 'https://api.day.app' }}
          ACTIONS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="X Assistant 部署失败"
          body="$(cat <<EOF
          分支：${GITHUB_REF_NAME}
          提交：${GITHUB_SHA::7}
          EOF
          )"

          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n \
              --arg device_key "$BARK_KEY" \
              --arg title "$title" \
              --arg body "$body" \
              --arg url "$ACTIONS_URL" \
              '{device_key: $device_key, title: $title, body: $body, url: $url, level: "critical"}')" \
            "${BARK_SERVER_URL%/}/push"
