<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <title>X 助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">X ASSISTANT</p>
        <h1>X 助手</h1>
      </div>
      <button id="settingsButton" class="text-button" type="button">设置</button>
    </header>

    <section class="notice"><strong>人工确认模式</strong><span>只生成草稿，不读取 Cookie，不自动发布。页面加载完成后，模型请求直接连接 DeepSeek。</span></section>

    <section class="model-status" aria-live="polite">
      <div class="connection-row"><span>大模型连接：<strong id="connectionState" data-state="unknown">未检测</strong></span><button id="testConnectionButton" class="text-button" type="button">检测连接</button></div>
      <label class="model-choice">当前模型<select id="modelSelect" aria-label="选择模型"><option value="deepseek-chat">deepseek-chat</option></select></label>
    </section>

    <nav class="tabs" aria-label="功能切换">
      <button class="tab-button active" data-tab="reply" type="button">回复建议</button>
      <button class="tab-button" data-tab="ideas" type="button">我该发什么</button>
    </nav>
    <section id="replyTab" data-tab-panel="reply">
      <section class="card">
        <h2>回复建议</h2>
        <p class="helper-text">粘贴 X 帖子正文，选择语言和风格，生成 3 条评论草稿。</p>
        <div class="input-heading"><span>帖子正文</span><div><button id="pastePostButton" class="text-button" type="button">读取粘贴板</button><button id="clearPostButton" class="text-button" type="button">清空</button></div></div>
        <textarea id="postInput" rows="7" placeholder="把 X 帖子正文粘贴到这里"></textarea>
        <div class="control-grid">
          <label>回复语言<select id="languageSelect"><option value="zh">中文</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select></label>
          <label>回复风格<select id="styleSelect"><option value="insightful">补充观点</option><option value="practical">实操建议</option><option value="question">提问式</option><option value="concise">极简回应</option><option value="professional">专业分析</option><option value="friendly">友好支持</option><option value="contrarian">温和反驳</option><option value="witty">轻松幽默</option></select></label>
        </div>
        <textarea id="profileInput" rows="3" placeholder="可选：你的账号定位，例如：分享企业知识库和 AI 落地经验，不做夸张营销。"></textarea>
        <button id="draftButton" class="primary-button" type="button">生成评论草稿</button>
      </section>
      <section id="replyResult" class="card hidden">
        <div class="result-heading"><h2>草稿</h2><span id="replyMode" class="badge">DeepSeek</span></div>
        <div id="replyLoading" class="reply-loading hidden" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span>正在生成评论草稿…</span></div>
        <div id="analysisCard" class="analysis-card"></div>
        <div id="draftList" class="draft-list"></div>
      </section>
    </section>

    <section id="ideasTab" data-tab-panel="ideas" class="hidden">
      <section class="card">
        <h2>今天发什么</h2>
        <p class="helper-text">随机给你一个像人说出来的念头。觉得不合适，就换一个。</p>
        <div id="ideaTypeFilters" class="idea-type-filters" aria-label="内容类型">
          <button class="idea-type-button active" type="button" data-idea-type="all">全部</button>
          <button class="idea-type-button" type="button" data-idea-type="code">代码</button>
          <button class="idea-type-button" type="button" data-idea-type="stock">股票</button>
          <button class="idea-type-button" type="button" data-idea-type="mood">心情</button>
          <button class="idea-type-button" type="button" data-idea-type="life">人生</button>
          <button class="idea-type-button" type="button" data-idea-type="work">职场</button>
          <button class="idea-type-button" type="button" data-idea-type="ai">AI</button>
          <button class="idea-type-button" type="button" data-idea-type="daily">生活</button>
          <button class="idea-type-button" type="button" data-idea-type="reading">读书感悟</button>
          <button class="idea-type-button" type="button" data-idea-type="travel">旅行</button>
          <button class="idea-type-button" type="button" data-idea-type="scenery">风景</button>
        </div>
        <div class="control-grid">
          <label>生成语言<select id="ideaLanguageSelect"><option value="zh" selected>中文</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select></label>
        </div>
        <textarea id="contentProfileInput" rows="2" placeholder="可选：你的账号定位，例如分享企业知识库和 AI 落地经验。"></textarea>
        <button id="ideasRefreshButton" class="primary-button" type="button">换一个</button>
      </section>
      <section id="ideasResult" class="card">
        <div class="result-heading"><h2>随机碎碎念</h2><span id="ideasMode" class="badge">DeepSeek</span></div>
        <div id="ideaLoading" class="reply-loading" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span>正在想一条…</span></div>
        <div id="ideaCard" class="idea-card hidden"></div>
      </section>
    </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <p id="errorMessage" class="error hidden"></p>
  </main>
  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <h2>模型设置</h2>
      <label>DeepSeek API Key<input id="apiKeyInput" type="password" autocomplete="off" placeholder="sk-..."></label>
      <p class="helper-text">Key 只保存在当前浏览器的本地存储，并直接发送到 DeepSeek 官方接口。</p>
      <div class="dialog-actions"><button class="text-button" value="cancel">取消</button><button class="primary-button" value="save">保存</button></div>
    </form>
  </dialog>
  <script src="idea-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
