<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X 助手</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">X ASSISTANT</p>
        <h1>X 助手</h1>
      </div>
      <button id="settingsButton" class="icon-button" title="打开设置">设置</button>
    </header>

    <section class="notice">
      <strong>人工确认模式</strong>
      <span>只生成草稿，不读取 Cookie，不填写或发布回复。</span>
    </section>

    <nav class="tabs" aria-label="功能切换">
      <button class="tab-button active" data-tab="reply" type="button">回复当前帖子</button>
      <button class="tab-button" data-tab="trending" type="button">发现热门</button>
      <button class="tab-button" data-tab="ideas" type="button">我该发什么</button>
    </nav>

    <section id="replyTab" data-tab-panel="reply">
      <section class="section">
        <div class="section-heading">
          <h2>当前帖子</h2>
          <button id="extractButton" class="secondary-button">读取</button>
        </div>
        <div id="postState" class="empty-state">打开 X 帖子后点击“读取”。</div>
        <article id="postCard" class="post-card hidden"></article>
      </section>

      <section class="section">
        <div class="section-heading">
          <h2>回复设置</h2>
        </div>
        <div class="control-grid">
          <label>
            回复语言
            <select id="languageSelect" aria-label="回复语言">
              <option value="zh">中文</option>
              <option value="en">English</option>
              <option value="vi">Tiếng Việt</option>
            </select>
          </label>
          <label>
            回复风格
            <select id="styleSelect" aria-label="回复风格">
              <option value="insightful">补充观点</option>
              <option value="practical">实操建议</option>
              <option value="question">提问式</option>
              <option value="concise">极简回应</option>
              <option value="professional">专业分析</option>
              <option value="friendly">友好支持</option>
              <option value="contrarian">温和反驳</option>
              <option value="witty">轻松幽默</option>
            </select>
          </label>
        </div>
        <textarea id="profileInput" rows="3" placeholder="可选：你的账号定位，例如：分享企业知识库和 AI 落地经验，不做夸张营销。"></textarea>
        <button id="draftButton" class="primary-button" disabled>生成评论草稿</button>
      </section>

      <section id="resultSection" class="section hidden">
        <div class="section-heading">
          <h2>草稿</h2>
          <span id="modeBadge" class="badge">本地演示</span>
        </div>
        <div id="analysisCard" class="analysis-card"></div>
        <div id="draftList" class="draft-list"></div>
      </section>
    </section>

    <section id="ideasTab" data-tab-panel="ideas" class="hidden">
      <section class="section">
        <div class="section-heading">
          <h2>今天发什么</h2>
          <span class="badge">随机灵感</span>
        </div>
        <p class="helper-text">随机给你一个像人说出来的念头。觉得不合适，就换一个。</p>
        <div id="ideaTypeFilters" class="idea-type-filters" aria-label="内容类型">
          <button class="idea-type-button active" type="button" data-idea-type="all">全部</button>
          <button class="idea-type-button" type="button" data-idea-type="code">代码</button>
          <button class="idea-type-button" type="button" data-idea-type="stock">股票</button>
          <button class="idea-type-button" type="button" data-idea-type="mood">心情</button>
          <button class="idea-type-button" type="button" data-idea-type="life">人生</button>
          <button class="idea-type-button" type="button" data-idea-type="work">职场</button>
          <button class="idea-type-button" type="button" data-idea-type="ai">AI</button>
          <button class="idea-type-button" type="button" data-idea-type="daily">生活</button>
          <button class="idea-type-button" type="button" data-idea-type="reading">读书感悟</button>
          <button class="idea-type-button" type="button" data-idea-type="travel">旅行</button>
          <button class="idea-type-button" type="button" data-idea-type="scenery">风景</button>
        </div>
        <label class="idea-language-label">
          生成语言
          <select id="ideaLanguageSelect">
            <option value="zh" selected>中文</option>
            <option value="en">English</option>
            <option value="vi">Tiếng Việt</option>
          </select>
        </label>
        <textarea id="contentProfileInput" rows="2" placeholder="可选：你的账号定位，例如分享企业知识库和 AI 落地经验。"></textarea>
        <button id="ideasRefreshButton" class="primary-button" type="button">换一个</button>
      </section>
      <section id="ideasResultSection" class="section">
        <div class="section-heading">
          <h2>随机碎碎念</h2>
          <span id="ideasModeBadge" class="badge">本地演示</span>
        </div>
        <div id="ideaLoading" class="idea-loading hidden" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span>正在想一条…</span></div>
        <div id="ideaCard" class="random-idea-card hidden"></div>
      </section>
    </section>

    <section id="trendingTab" data-tab-panel="trending" class="hidden">
      <section class="section">
        <div class="section-heading">
          <h2>发现热门帖子</h2>
          <button id="scanTrendingButton" class="secondary-button" type="button">读取当前页</button>
        </div>
        <p class="helper-text">打开 X 的 Explore、搜索结果或列表页后读取。只分析当前页面已经加载的帖子。</p>
        <div id="trendingState" class="empty-state">读取后按互动量排序；再次读取可看到本地记录的增长。</div>
      </section>
      <section id="trendingResultSection" class="section hidden">
        <div class="section-heading">
          <h2>热门候选</h2>
        </div>
        <div id="trendingList" class="draft-list"></div>
      </section>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <p id="errorMessage" class="error hidden"></p>
  </main>
  <script src="h5/idea-engine.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
